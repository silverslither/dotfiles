[processes]
columns = ["pid", "name", "cpu%", "gpu%", "mem", "gmem", "r/s", "w/s", "user", "state", "time"]
default_memory_value = true

[[row]]
  [[row.child]]
    ratio = 2
    type="cpu"
  [[row.child]]
    ratio = 1
    type="net"
[[row]]
  [[row.child]]
    [[row.child.child]]
      ratio=3
      type="temp"
    [[row.child.child]]
      ratio=2
      type="disk"
  [[row.child]]
    type="mem"
[[row]]
  [[row.child]]
    type="proc"
    default=true
